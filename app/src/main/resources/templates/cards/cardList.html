<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카드 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-thumbnail {
            width: 96px;
            height: 64px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }

        .no-image {
            width: 96px;
            height: 64px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            border: 1px dashed #ced4da;
            color: #868e96;
            font-size: 12px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>
            <span th:if="${deck == null}">전체 카드 목록</span>
            <span th:if="${deck != null}" th:text="|${deck.name} 카드 목록|">덱 카드 목록</span>
        </h1>
        <div>
            <a class="btn btn-outline-secondary" href="/">홈</a>
            <a class="btn btn-outline-secondary" href="/decks">덱 목록</a>
            <a class="btn btn-warning" href="/cards/new">카드 등록</a>
        </div>
    </div>

    <table class="table table-bordered align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>이미지</th>
            <th>단어</th>
            <th>뜻</th>
            <th>덱</th>
            <th>이미지 출처</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="card : ${cards}">
            <td th:text="${card.id}">1</td>
            <td>
                <a th:if="${card.imageUrl != null and !#strings.isEmpty(card.imageUrl)}"
                   th:href="${card.imageUrl}"
                   target="_blank"
                   rel="noopener noreferrer">
                    <img th:src="${#strings.isEmpty(card.imageThumbnailUrl) ? card.imageUrl : card.imageThumbnailUrl}"
                         class="card-thumbnail"
                         alt="카드 이미지">
                </a>
                <span th:unless="${card.imageUrl != null and !#strings.isEmpty(card.imageUrl)}"
                      class="no-image">이미지 없음</span>
            </td>
            <td th:text="${card.word}">apple</td>
            <td th:text="${card.meaning}">사과</td>
            <td th:text="${card.deck.name}">영단어</td>
            <td>
                <a th:if="${card.imageSourceUrl != null and !#strings.isEmpty(card.imageSourceUrl)}"
                   th:href="${card.imageSourceUrl}"
                   th:text="${#strings.isEmpty(card.imageAuthor) ? card.imageSource : card.imageAuthor}"
                   target="_blank"
                   rel="noopener noreferrer">출처</a>
                <span th:if="${(card.imageSourceUrl == null or #strings.isEmpty(card.imageSourceUrl)) and card.imageSource != null and !#strings.isEmpty(card.imageSource)}"
                      th:text="${card.imageSource}">Pexels</span>
                <span th:unless="${card.imageSourceUrl != null and !#strings.isEmpty(card.imageSourceUrl) or card.imageSource != null and !#strings.isEmpty(card.imageSource)}"
                      class="text-muted">-</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
