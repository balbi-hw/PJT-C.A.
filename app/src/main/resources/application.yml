spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/anki
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

pexels:
  api-key: ${PEXELS_API_KEY}
  base-url: https://api.pexels.com/v1